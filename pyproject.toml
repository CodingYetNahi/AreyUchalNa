[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "something-picker"
version = "0.1.0"
description = "A tiny command-line decision helper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prashant" }]

[project.scripts]
something = "something.cli:main"

[tool.setuptools.packages.find]
include = ["something*"]
